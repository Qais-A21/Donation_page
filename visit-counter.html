<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resala AUC — Winter Visit Counter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="icon" href="assets/logo.jpeg" type="image/jpeg">
<style>
  :root {
    --navy: #0c2c80; --night: #081d57; --ice: #dff1ff; --sky: #a7d4f2;
    --glow: #ffd27a; --frost: #f4faff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: var(--frost);
    font-family: 'Patrick Hand', 'Segoe UI', cursive, sans-serif;
    background:
      radial-gradient(circle at 50% 110%, rgba(255,210,122,0.3), transparent 55%),
      radial-gradient(rgba(255,255,255,0.55) 1px, transparent 1.5px),
      radial-gradient(rgba(255,255,255,0.35) 1px, transparent 1.5px),
      linear-gradient(to bottom, var(--night), var(--navy));
    background-size: auto, 83px 83px, 47px 47px, auto;
    background-position: 0 0, 10px 20px, 30px 5px, 0 0;
  }
  #snow { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  .ground {
    position: fixed; left: 0; right: 0; bottom: 0; height: 9vh; min-height: 40px;
    background: var(--ice);
    -webkit-mask: radial-gradient(28px at 28px 0, #0000 98%, #000) 0 0 / 56px 100% repeat-x;
            mask: radial-gradient(28px at 28px 0, #0000 98%, #000) 0 0 / 56px 100% repeat-x;
  }

  .logo {
    width: clamp(56px, 12vh, 90px); height: clamp(56px, 12vh, 90px);
    border-radius: 50%; background: #fff; border: 3px solid var(--sky);
  }
  h1 { margin: 1.5vh 0 0; font-size: clamp(1.4rem, 4.5vh, 2.4rem); font-weight: 400; letter-spacing: .5px; }
  .sub { margin: .5vh 0 0; color: var(--glow); font-size: clamp(1rem, 2.8vh, 1.4rem); }

  .counter {
    position: relative; margin-top: 4vh; padding: 3vh 6vw;
    background: rgba(255,255,255,0.08); border: 3px solid var(--sky); border-radius: 26px;
    box-shadow: 0 0 40px rgba(167,212,242,0.25), inset 0 0 30px rgba(255,255,255,0.05);
    backdrop-filter: blur(2px);
  }
  .number {
    font-size: clamp(4rem, 22vh, 11rem); line-height: 1; color: #fff;
    text-shadow: 0 0 24px rgba(167,212,242,0.7);
    font-variant-numeric: tabular-nums;
    transition: transform .25s ease;
  }
  .number.bump { transform: scale(1.12); color: var(--glow); }
  .label { margin-top: 1vh; font-size: clamp(1rem, 3vh, 1.6rem); color: var(--ice); }

  .status { margin-top: 3vh; font-size: clamp(.85rem, 2.2vh, 1.1rem); color: var(--sky); }
  .dot { display: inline-block; width: .6em; height: .6em; border-radius: 50%; background: #6fdc8c; margin-right: .5em; animation: pulse 2s infinite; }
  .dot.off { background: #e07a7a; animation: none; }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { #snow { display: none; } .dot { animation: none; } }
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<div class="ground" aria-hidden="true"></div>

<img class="logo" src="assets/logo.jpeg" alt="Resala AUC logo">
<h1>Resala AUC</h1>
<p class="sub">Winter Warmth Campaign ❄</p>

<div class="counter">
  <div class="number" id="count" aria-live="polite">–</div>
  <div class="label">people have visited the donation link</div>
</div>

<p class="status"><span class="dot off" id="dot"></span><span id="status">Connecting…</span></p>

<script src="winter-snow.js"></script>
<script>
  var NAMESPACE = "resala-auc-donation";
  var KEY = "visits";
  var URL = "https://abacus.jasoncameron.dev/get/" + NAMESPACE + "/" + KEY;
  var REFRESH_MS = 10000;
  var shown = null;

  var elCount = document.getElementById("count");
  var elDot = document.getElementById("dot");
  var elStatus = document.getElementById("status");

  function show(n) {
    if (shown !== null && n > shown) {
      elCount.classList.add("bump");
      setTimeout(function () { elCount.classList.remove("bump"); }, 600);
    }
    shown = n;
    elCount.textContent = n.toLocaleString("en-US");
  }

  function refresh() {
    fetch(URL, { cache: "no-store" })
      .then(function (r) {
        if (r.status === 404) return { value: 0 };   // nobody has visited yet
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (d) {
        show(Number(d.value) || 0);
        elDot.classList.remove("off");
        elStatus.textContent = "Live — updates automatically";
      })
      .catch(function () {
        elDot.classList.add("off");
        elStatus.textContent = "Reconnecting…";
      });
  }

  refresh();
  setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
